<header class="workspace-heading">
  <div>
    <h1 tabindex="-1">Forum</h1>
    <p class="workspace-heading__summary">Long-form analysis and replies from the community.</p>
  </div>
  {{forumCreateAction}}
</header>
<div class="page-grid page-grid--forum">
  <div class="page-main">
    <section class="panel stack" id="forum-threads" data-composer-section="forum-threads" data-section-label="Threads">
      <h2>Articles</h2>
      <p class="muted">{{forumNotice}}</p>
      <form class="form-inline forum-search" method="get" action="/forum" data-enhance="forum-search">
        <label class="field">
          <span>Search articles</span>
          <input type="search" name="q" value="{{forumSearchQuery}}" maxlength="120" />
        </label>
        <button class="ghost" type="submit">Search</button>
        {{forumClearSearch}}
      </form>
      {{threadsEmpty}}
      <ul class="forum-thread-list">
        {{threads}}
      </ul>
      {{threadsPager}}
    </section>
  </div>
  <aside class="page-aside">
    <section class="panel stack" id="forum-compose" data-composer-section="forum-compose" data-section-label="New thread">
      <h2>Publish an article</h2>
      <p class="muted">{{forumPostingNotice}}</p>
      <details class="form-toggle" {{composeOpen}} {{forumComposeHidden}}>
        <summary>Write a new article</summary>
        <form class="stack" method="post" action="/forum" data-enhance="forum">
          <label class="field">
            <span>Title</span>
            <input name="title" maxlength="160" required />
          </label>
          <label class="field">
            <span>Category (optional)</span>
            <input name="topic" list="forum-topics" maxlength="80" placeholder="Choose or enter a category" />
          </label>
          <datalist id="forum-topics">{{topicDatalist}}</datalist>
          <label class="field">
            <span>Body</span>
            <textarea name="content" rows="6" maxlength="1200" required></textarea>
          </label>
          <div class="cta-row">
            <button class="cta" type="submit">Publish article</button>
          </div>
        </form>
      </details>
    </section>
  </aside>
</div>
