<section class="panel" id="petitions-filters" data-composer-section="petitions-filters" data-section-label="Stage filter">
  <form class="form-inline" method="get" action="/petitions" data-enhance="petitions-filter">
    {{petitionsFilterScope}}
    <label class="field">
      <span>Filter by stage</span>
      <select name="stage">
        {{stageFilterOptions}}
      </select>
    </label>
    <button class="ghost" type="submit">Apply filter</button>
  </form>
</section>
