<header class="workspace-heading">
  <div>
    <h1 tabindex="-1">Notifications</h1>
    <p>{{unreadLabel}}</p>
  </div>
  <form class="cta-row" method="post" action="/notifications/read" data-enhance="notifications" {{markReadHidden}}>
    <input type="hidden" name="page" value="{{pageNumber}}" />
    <button class="ghost" type="submit">Mark all read</button>
  </form>
</header>
<div class="page-grid page-grid--notifications">
  <div class="page-main">
    <section class="panel" data-composer-section="notifications-inbox" data-section-label="Alerts inbox">
      <h2>Inbox</h2>
      {{notifications}}
      {{notificationsPager}}
    </section>
  </div>
  <aside class="page-aside" aria-label="Alert settings">
    {{preferencesPanel}}
  </aside>
</div>
