<div class="page-grid page-grid--groups">
  <div class="page-main">
    <section class="panel" data-composer-section="groups-list" data-section-label="Available groups">
      <p class="eyebrow">Groups</p>
      <h2>Think tanks &amp; cohorts</h2>
      <p class="muted small is-verbose">Handle: {{personHandle}} · Hash: {{personHash}}</p>
      <p class="muted small is-verbose">{{circlePolicyNote}}</p>
      <div class="discussion-list">
        {{groups}}
      </div>
    </section>
  </div>
  <aside class="page-aside">
    <section class="panel" data-composer-section="groups-create" data-section-label="Create a group">
      <p class="eyebrow">Groups</p>
      <h3>Create a group</h3>
      <form class="stack" method="post" action="/groups" data-enhance="groups">
        <input type="hidden" name="action" value="create" />
        <div class="form-grid">
          <label class="field">
            <span>Name</span>
            <input name="name" placeholder="Energy Circle" required />
          </label>
          <label class="field">
            <span>Topics (comma-separated)</span>
            <input name="topics" placeholder="energy,climate" />
          </label>
        </div>
        <label class="field">
          <span>Description</span>
          <textarea name="description" rows="3" placeholder="Purpose of this group"></textarea>
        </label>
        <div class="cta-row">
          <button class="cta" type="submit">Create group</button>
        </div>
      </form>
    </section>
  </aside>
</div>
