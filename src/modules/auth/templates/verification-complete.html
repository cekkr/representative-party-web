<section class="panel" data-composer-section="verification-complete">
  <p class="eyebrow">Verification complete</p>
  <h2>{{actorLabelTitle}} session established</h2>
  <p>Your session is verified and ready to post.</p>
  <div class="callout is-verbose">
    <p class="muted">PID hash (truncated)</p>
    <code>{{pidHashShort}}…</code>
  </div>
  <p class="muted small is-verbose">ActivityPub actor minted: <code>{{actorId}}</code></p>
  <p class="muted small is-verbose">{{ledgerNote}}</p>
  <div class="cta-row">
    <a class="cta" href="/social/feed" data-partial>Open your wall</a>
    <a class="ghost" href="/discussion" data-partial>Join discussion</a>
  </div>
</section>
