<section class="panel" id="discussion-filters" aria-label="Feed filters" data-composer-section="discussion-filters" data-section-label="Feed filters">
  <form class="form-grid" method="get" action="/discussion" data-enhance="discussion-filter">
    {{discussionFilterScope}}
    <label class="field">
      <span>Filter by topic</span>
      <select name="topic">
        <option value="" {{topicFilterSelectedAll}}>All topics</option>
        {{topicFilterOptions}}
      </select>
    </label>
    <div class="cta-row">
      <button class="ghost" type="submit">Apply filter</button>
    </div>
  </form>
</section>
