<header class="topbar">
  <div class="topbar__brand">
    <div class="orb"></div>
    <div>
      <p
        class="eyebrow"
        data-composer-key="layout.brandEyebrow"
        data-composer-default="{{brandEyebrowDefault}}"
        style="{{brandEyebrowStyle}}"
      >{{brandEyebrow}}</p>
      <h1 data-composer-key="layout.brandTitle" data-composer-default="{{brandTitleDefault}}" style="{{brandTitleStyle}}">
        {{brandTitle}}
      </h1>
      <p
        class="tagline"
        data-composer-key="layout.brandTagline"
        data-composer-default="{{brandTaglineDefault}}"
        style="{{brandTaglineStyle}}"
      >{{brandTagline}}</p>
      <p class="muted small is-verbose">{{personHandle}}</p>
    </div>
  </div>
  <nav class="topbar__actions">
    <button class="ghost verbosity-toggle" type="button" data-verbosity-toggle title="Verbosity: {{verbosityToggleSource}}">
      Verbosity: {{verbosityToggleLabel}}
    </button>
    <div class="quick-nav">
      {{quickLinks}}
    </div>
  </nav>
</header>
