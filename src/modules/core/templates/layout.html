<!doctype html>
<html lang="en" data-ui-accent="{{uiAccent}}" data-ui-density="{{uiDensity}}" data-theme="{{uiTheme}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{title}}</title>
  <link rel="icon" href="/public/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/public/app.css" />
  <style id="composer-theme">{{themeCss}}</style>
  <script src="/public/app.js" defer></script>
</head>
<body
  data-verbosity="{{verbosityMode}}"
  data-page-key="{{pageKey}}"
  data-verbosity-default="{{verbosityDefault}}"
  data-verbosity-override="{{verbosityOverride}}"
  data-verbosity-page-preset="{{verbosityPagePreset}}"
  data-verbosity-can-save="{{verbosityCanSave}}"
  data-composer-settings="{{composerSettingsAttr}}"
  data-composer-allowed="{{composerAllowed}}"
  data-ui-settings-server="{{uiSettingsServer}}"
  data-ui-vocabulary="{{uiVocabulary}}"
  data-composer-mode="off"
  style="{{themeVars}}"
>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  {{> topbar}}
  {{composerControls}}
  {{> shell}}
  {{> footer}}
</body>
</html>
