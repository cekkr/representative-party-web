<section class="panel" data-module-disabled="{{moduleKey}}" data-composer-section="module-disabled">
  <p class="eyebrow">Module disabled</p>
  <h2>{{moduleName}} is currently off</h2>
  <p class="muted small">{{moduleNote}}</p>
  <p class="muted small">Ask your provider admin to enable this module or choose another workspace path.</p>
  <div class="cta-row">
    <a class="ghost" href="/" data-partial>Back home</a>
    <a class="ghost" href="/admin#modules" data-partial>Review module toggles</a>
  </div>
</section>
