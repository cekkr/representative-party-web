<section class="panel home-overview" id="home-overview" data-composer-section="home-overview" data-section-label="Workspace overview">
  <div class="home-overview__hero">
    <div class="home-overview__intro">
      <h2>Workspace overview</h2>
      <p>{{summaryText}}</p>
      <div class="discussion__meta">
        {{overviewPills}}
      </div>
      <p class="muted small">{{overviewNote}}</p>
      <div class="cta-row">
        {{overviewActions}}
      </div>
    </div>
    <aside class="home-access" id="home-access" aria-labelledby="home-access-title">
      <h3 id="home-access-title">Current access</h3>
      <div class="home-access__list">
        {{accessList}}
      </div>
    </aside>
  </div>
  <div class="grid home-stats" id="home-metrics">
    {{homeStats}}
  </div>
</section>
