<section class="panel home-overview" id="home-overview" data-composer-section="home-overview">
  <div class="home-overview__hero">
    <div class="home-overview__intro">
      <p class="eyebrow">Home workspace</p>
      <h2>{{circleName}}</h2>
      <p>{{summaryText}}</p>
      <div class="discussion__meta">
        {{overviewPills}}
      </div>
      <p class="muted small">{{overviewNote}}</p>
      <div class="cta-row">
        {{overviewActions}}
      </div>
    </div>
    <aside class="home-access" id="home-access">
      <p class="eyebrow">Current access</p>
      <div class="home-access__list">
        {{accessList}}
      </div>
    </aside>
  </div>
  <div class="grid home-stats" id="home-metrics">
    {{homeStats}}
  </div>
</section>
