<section class="panel" id="social-compose" tabindex="-1" aria-labelledby="social-compose-title" data-composer-section="social-compose" data-section-label="Composer" {{socialComposerHidden}}>
  <h2 id="social-compose-title">Share a short update</h2>
  <details class="form-toggle" {{composeState}}>
    <summary>Write an update</summary>
    <form class="stack" method="post" action="/social/post" data-enhance="social-post" enctype="multipart/form-data">
      <div class="topic-byline">{{socialComposerActor}}</div>
      <label class="field">
        <span>Update</span>
        <textarea name="content" rows="3" maxlength="560" aria-describedby="social-upload-note"></textarea>
      </label>
      <label class="field">
        <span>Photo or video (optional)</span>
        <input name="media" type="file" accept="image/*,video/*" aria-describedby="social-upload-note" />
      </label>
      <p class="muted small" id="social-upload-note">Add text, one attachment, or both. Attachments stay with this provider and viewers request access.</p>
      <fieldset class="stack social-audience">
        <legend>Audience</legend>
        <label class="field">
          <span>Who can read this?</span>
          <select name="visibility" aria-describedby="social-audience-note">
            <option value="public">Public</option>
            <option value="direct">Direct</option>
          </select>
        </label>
        <p class="muted small" id="social-audience-note">Visitors can read public updates. A direct update goes to one handle.</p>
        <label class="field">
          <span>Recipient handle for direct updates</span>
          <input name="targetHandle" placeholder="@handle" maxlength="64" />
        </label>
        <button class="cta" type="submit">Send update</button>
      </fieldset>
    </form>
  </details>
</section>
