<section class="panel" id="social-controls" aria-label="Feed filters" data-composer-section="social-controls" data-section-label="Feed filters" {{socialFollowsHidden}}>
  <details class="form-toggle collection-filters" {{socialFilterOpen}}>
    <summary>Filter by follow type <span class="muted small">{{socialFilterSummary}}</span></summary>
    <form class="form-grid" method="get" action="/social/feed" data-enhance="social-filter">
      <label class="field">
        <span>Follow type</span>
        <select name="type">
          <option value="" {{followTypeSelectedAll}}>{{followTypeAllLabel}}</option>
          {{followTypeOptions}}
        </select>
      </label>
      <div class="cta-row">
        <button class="ghost" type="submit">Apply filter</button>
        {{socialClearFilter}}
      </div>
    </form>
    <p class="muted small">Your updates and direct messages appear with every follow type.</p>
  </details>
</section>
