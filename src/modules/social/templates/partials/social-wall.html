<section class="panel" id="social-wall">
  <p class="eyebrow">Wall</p>
  <h2>Your wall</h2>
  <p class="is-verbose">Updates from the {{actorLabelPlural}} you follow, plus public posts relevant to your interests.</p>
  <div class="callout is-verbose">
    <p class="muted small">Handle: {{personHandle}}</p>
    <p class="muted small">Role: {{roleLabel}}</p>
    <p class="muted small">Following: {{followCount}} | Followers: {{followerCount}}</p>
  </div>
  <div class="wall-feed">
    {{feedList}}
  </div>
</section>
