<header class="workspace-heading">
  <div>
    <h1 tabindex="-1">People</h1>
    <p class="workspace-heading__summary">Find verified {{directoryActorPlural}} to follow or delegate a topic to. Delegations stay advisory and revocable.</p>
  </div>
  <p class="workspace-heading__actions"><a class="ghost" href="/delegation" data-partial>Your delegations</a></p>
</header>
<div class="page-main stack">
  <section class="panel" id="delegate-search" data-composer-section="delegate-directory" data-section-label="Search people">
    <form class="collection-search" method="get" action="/delegates" role="search" data-enhance="delegate-search">
      <label class="field">
        <span>Search people</span>
        <input type="search" name="q" value="{{directoryQuery}}" placeholder="Handle or role" />
      </label>
      <button class="ghost" type="submit">Search</button>
      {{directoryClear}}
    </form>
  </section>
  <section class="panel stack" data-composer-section="delegate-directory-list" data-section-label="People list" aria-labelledby="people-results-title">
    <h2 id="people-results-title">Members</h2>
    <p class="muted small" aria-live="polite">{{directoryCount}}</p>
    {{directoryList}}
    {{directoryPager}}
  </section>
</div>
