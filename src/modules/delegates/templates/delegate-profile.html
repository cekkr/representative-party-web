<nav class="topic-breadcrumbs" aria-label="People">
  <a href="/delegates" data-partial>All people</a>
</nav>
<header class="workspace-heading profile-heading">
  <div class="person-row__id">
    {{profileAvatar}}
    <div>
      <h1 tabindex="-1" class="profile-heading__name">{{profileName}}</h1>
      <p class="topic-meta">{{profileStatus}}</p>
      {{profileBio}}
    </div>
  </div>
  {{profileAction}}
</header>
<nav class="workspace-sections" aria-label="Profile sections">
  {{profileSections}}
</nav>
<div class="page-grid page-grid--delegate-profile">
  <div class="page-main stack">
    {{profileContent}}
  </div>
  <aside class="page-aside" aria-label="Profile details">
    <section class="panel">
      <h2 class="h3">Details</h2>
      {{profileDetails}}
    </section>
  </aside>
</div>
