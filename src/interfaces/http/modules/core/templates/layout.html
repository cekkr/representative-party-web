<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{title}}</title>
  <link rel="stylesheet" href="/public/app.css" />
  <style id="composer-theme">{{themeCss}}</style>
  <script src="/public/app.js" defer></script>
</head>
<body
  data-verbosity="{{verbosityMode}}"
  data-page-key="{{pageKey}}"
  data-verbosity-default="{{verbosityDefault}}"
  data-verbosity-override="{{verbosityOverride}}"
  data-verbosity-page-preset="{{verbosityPagePreset}}"
  data-verbosity-can-save="{{verbosityCanSave}}"
  data-composer-settings="{{composerSettingsAttr}}"
  data-composer-allowed="{{composerAllowed}}"
  data-composer-mode="off"
  style="{{themeVars}}"
>
  <header class="topbar">
    <div class="topbar__brand">
      <div class="orb"></div>
      <div>
        <p
          class="eyebrow"
          data-composer-key="layout.brandEyebrow"
          data-composer-default="{{brandEyebrowDefault}}"
          style="{{brandEyebrowStyle}}"
        >{{brandEyebrow}}</p>
        <h1 data-composer-key="layout.brandTitle" data-composer-default="{{brandTitleDefault}}" style="{{brandTitleStyle}}">
          {{brandTitle}}
        </h1>
        <p
          class="tagline"
          data-composer-key="layout.brandTagline"
          data-composer-default="{{brandTaglineDefault}}"
          style="{{brandTaglineStyle}}"
        >{{brandTagline}}</p>
        <p class="muted small is-verbose">{{personHandle}}</p>
      </div>
    </div>
    <nav class="topbar__actions">
      <button class="ghost verbosity-toggle" type="button" data-verbosity-toggle title="Verbosity: {{verbosityToggleSource}}">
        Verbosity: {{verbosityToggleLabel}}
      </button>
      <div class="quick-nav">
        {{quickLinks}}
      </div>
    </nav>
  </header>
  <div class="shell">
    <aside class="side-nav" data-nav-shell>
      {{sideNav}}
    </aside>
    <main data-shell>
      {{statusStrip}}
      {{body}}
    </main>
  </div>
  <footer class="footer">
    <span
      data-composer-key="layout.footerNote"
      data-composer-default="{{footerNoteDefault}}"
      style="{{footerNoteStyle}}"
    >{{footerNote}}</span>
  </footer>
  {{composerControls}}
</body>
</html>
