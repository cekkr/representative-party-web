<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{title}}</title>
  <link rel="stylesheet" href="/public/app.css" />
  <style id="composer-theme">{{themeCss}}</style>
  <script src="/public/app.js" defer></script>
</head>
<body data-verbosity="{{verbosityMode}}" style="{{themeVars}}">
  <header class="topbar">
    <div class="topbar__brand">
      <div class="orb"></div>
      <div>
        <p class="eyebrow">Representative Party Framework</p>
        <h1>Party Circle</h1>
        <p class="tagline">Verifier-first kernel with QR handoff and ActivityPub hooks.</p>
        <p class="muted small is-verbose">{{personHandle}}</p>
      </div>
    </div>
    <nav class="topbar__actions">
      <div class="quick-nav">
        {{quickLinks}}
      </div>
    </nav>
  </header>
  <div class="shell">
    <aside class="side-nav" data-nav-shell>
      {{sideNav}}
    </aside>
    <main data-shell>
      {{statusStrip}}
      {{body}}
    </main>
  </div>
  <footer class="footer">
    <span>Vanilla SSR + Party Circle kernel prototype</span>
  </footer>
</body>
</html>
