<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Post Composer</title>
  <style>
    :root{
      --bg:#f0f2f5;
      --card:#ffffff;
      --text:#050505;
      --muted:#65676b;
      --border:#e4e6eb;
      --shadow:0 1px 2px rgba(0,0,0,.08);
      --radius:14px;
      --pill:#f0f2f5;

      --green:#31a24c;
      --blue:#1877f2;
      --orange:#f7b928;
      --purple:#8a3ab9;
      --red:#f02849;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background:var(--bg);
      color:var(--text);
      display:grid;
      place-items:start center;
      padding:24px 12px;
    }

    .composer{
      width:min(720px, 100%);
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:14px;
    }

    .row{
      display:flex;
      gap:12px;
      align-items:flex-start;
    }

    .avatar{
      width:44px; height:44px;
      border-radius:999px;
      background:linear-gradient(135deg, #cfd4da, #eef1f4);
      border:1px solid var(--border);
      flex:0 0 auto;
      position:relative;
      overflow:hidden;
    }
    .avatar::after{
      content:"";
      position:absolute;
      inset:10px 12px 8px 12px;
      border-radius:999px;
      background:rgba(0,0,0,.08);
    }

    .inputArea{
      flex:1 1 auto;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .fakeInput{
      display:flex;
      align-items:center;
      gap:10px;
      border-radius:999px;
      background:var(--pill);
      border:1px solid var(--border);
      padding:10px 12px;
    }

    textarea{
      width:100%;
      border:none;
      outline:none;
      resize:none;
      background:transparent;
      color:var(--text);
      font-size:16px;
      line-height:1.35;
      min-height:22px;
    }
    textarea::placeholder{ color:var(--muted); }

    .privacyLine{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-left:4px;
      margin-right:4px;
    }
    .who{
      display:inline-flex;
      align-items:center;
      gap:8px;
      color:var(--muted);
      font-size:13px;
    }
    .chip{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 10px;
      border:1px solid var(--border);
      background:#fff;
      border-radius:999px;
      font-size:13px;
      color:var(--text);
      cursor:pointer;
      user-select:none;
    }
    .chip:focus-visible{ outline:2px solid rgba(24,119,242,.4); outline-offset:2px; }

    hr{
      border:0;
      border-top:1px solid var(--border);
      margin:12px 0;
    }

    .actions{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:6px;
    }

    .btn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:10px 10px;
      border-radius:10px;
      border:1px solid transparent;
      background:transparent;
      cursor:pointer;
      color:var(--muted);
      font-weight:600;
      font-size:14px;
      transition: background .12s ease, border-color .12s ease;
      user-select:none;
      min-height:40px;
    }
    .btn:hover{ background:var(--pill); }
    .btn:focus-visible{
      outline:2px solid rgba(24,119,242,.35);
      outline-offset:2px;
    }

    .icon{
      width:18px; height:18px;
      display:inline-block;
      border-radius:6px;
      background:var(--muted);
      position:relative;
      flex:0 0 auto;
    }
    .icon.photo{ background:var(--green); }
    .icon.tag{ background:var(--blue); }
    .icon.feel{ background:var(--orange); }
    .icon.poll{ background:var(--purple); }
    .icon.location{ background:var(--red); }

    /* Add-to-post tray */
    .tray{
      margin-top:12px;
      border:1px solid var(--border);
      border-radius:12px;
      padding:10px 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      background:#fff;
    }
    .trayTitle{
      font-weight:700;
      font-size:14px;
    }
    .trayBtns{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .mini{
      width:36px; height:36px;
      border-radius:10px;
      border:1px solid transparent;
      background:transparent;
      cursor:pointer;
      display:grid;
      place-items:center;
      transition: background .12s ease;
    }
    .mini:hover{ background:var(--pill); }
    .mini:focus-visible{
      outline:2px solid rgba(24,119,242,.35);
      outline-offset:2px;
    }

    /* Hidden file input + label button */
    .file{
      position:absolute;
      width:1px; height:1px;
      padding:0; margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }

    .mediaPreview{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:2px;
      margin-left:4px;
    }
    .mediaItem{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border:1px solid var(--border);
      background:#fff;
      border-radius:999px;
      font-size:13px;
      color:var(--text);
    }
    .dot{
      width:10px; height:10px;
      border-radius:999px;
      background:var(--green);
    }

    /* Responsive */
    @media (max-width: 520px){
      .actions{ grid-template-columns:1fr; }
      .tray{ align-items:flex-start; flex-direction:column; }
      .trayBtns{ justify-content:flex-start; }
    }
  </style>
</head>
<body>
  <div class="composer" role="region" aria-label="Create post">
    <div class="row">
      <div class="avatar" aria-hidden="true"></div>

      <div class="inputArea">
        <div class="fakeInput">
          <textarea
            placeholder="What’s on your mind?"
            aria-label="Post text"
            rows="1"
          ></textarea>
        </div>

        <div class="privacyLine">
          <div class="who">
            <span style="font-weight:700;color:var(--text);">Riccardo</span>
            <span aria-hidden="true">•</span>
            <button class="chip" type="button" aria-label="Audience">
              🌐 Public
            </button>
          </div>

          <button class="chip" type="button" aria-label="Post options">
            ⚙️ Options
          </button>
        </div>

        <!-- Optional: media selection input -->
        <input class="file" id="media" type="file" accept="image/*,video/*" multiple />
        <div class="mediaPreview" aria-label="Selected media (static preview)">
          <!-- Static placeholders (no JS). Remove if you don’t want them. -->
          <div class="mediaItem"><span class="dot"></span> photo_01.jpg</div>
          <div class="mediaItem"><span class="dot"></span> clip_02.mp4</div>
        </div>
      </div>
    </div>

    <hr />

    <div class="actions" aria-label="Quick actions">
      <label class="btn" for="media" title="Add photos or videos">
        <span class="icon photo" aria-hidden="true"></span>
        Photo/Video
      </label>

      <button class="btn" type="button" title="Tag people">
        <span class="icon tag" aria-hidden="true"></span>
        Tag people
      </button>

      <button class="btn" type="button" title="Feeling/activity">
        <span class="icon feel" aria-hidden="true"></span>
        Feeling/Activity
      </button>
    </div>

    <div class="tray" aria-label="Add to your post">
      <div class="trayTitle">Add to your post</div>

      <div class="trayBtns">
        <label class="mini" for="media" title="Media" aria-label="Add media">
          <span class="icon photo" aria-hidden="true"></span>
        </label>

        <button class="mini" type="button" title="Poll" aria-label="Add poll">
          <span class="icon poll" aria-hidden="true"></span>
        </button>

        <button class="mini" type="button" title="Location" aria-label="Add location">
          <span class="icon location" aria-hidden="true"></span>
        </button>

        <button class="mini" type="button" title="Tag" aria-label="Tag people">
          <span class="icon tag" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
